<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitud de Crédito - Inicio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #ffffff; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); padding: 40px 30px; max-width: 450px; width: 100%; text-align: center; }
        .card h2 { color: #2b6cb0; margin-bottom: 10px; font-size: 24px; }
        .card p { color: #4a5568; font-size: 15px; margin-bottom: 25px; line-height: 1.5; }
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 14px; color: #4a5568; font-weight: 600; }
        .input-field { width: 100%; padding: 12px; font-size: 16px; border: 2px solid #e2e8f0; border-radius: 8px; outline: none; }
        .input-field:focus { border-color: #2b6cb0; }
        .btn-submit { width: 100%; background-color: #2b6cb0; color: white; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; }
        .btn-submit:hover { background-color: #2c5282; }
        .alert { padding: 12px; border-radius: 6px; font-size: 14px; margin-bottom: 15px; text-align: left; background-color: #fff5f5; color: #c53030; border: 1px solid #fed7d7; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Comienza tu Solicitud</h2>
        <p>Ingresa tu correo electrónico para enviarte un código de acceso seguro.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="/enviar-otp" method="POST">
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" class="input-field" placeholder="ejemplo@correo.com" required autofocus>
            </div>
            <button type="submit" class="btn-submit">Continuar</button>
        </form>
    </div>
</body>
</html>
